{% extends "base.html" %}
{% load static %}

{% block content %}
<section class="min-h-[calc(100vh-104px)] bg-cover bg-center px-6 py-10"
    style="background-image: linear-gradient(rgba(240, 244, 248, 0.7), rgba(240, 244, 248, 0.7)), url('{% static "img/image-2.png" %}');">

    <div class="max-w-5xl mx-auto relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold font-marcellus text-gray-900 tracking-wider">
                Pengaturan Profil Staf
            </h1>
        </div>

        <div class="bg-white border border-gray-200 rounded-[24px] shadow-sm p-10">
            <form method="POST" action="/update-profile/">
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
                    <div class="md:col-span-2 max-w-2xl">
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">Email</label>
                        <input type="email" value="{{ email }}" readonly placeholder="admin@aeromiles.com"
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-50 text-gray-500 focus:outline-none font-inter cursor-not-allowed">
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">ID Staf</label>
                        <input type="text" value="{{ id_staf }}" readonly placeholder="S0001"
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-gray-50 text-gray-500 focus:outline-none font-inter cursor-not-allowed">
                    </div>

                    <div class="hidden md:block"></div>

                    <div class="md:col-span-2 max-w-2xl">
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">Salutation</label>
                        <select name="salutation" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#1a2b49] font-inter text-gray-800 cursor-pointer">
                            <option value="">Pilih Salutation</option>
                            <option value="Mr." {% if salutation == "Mr." %}selected{% endif %}>Mr.</option>
                            <option value="Mrs." {% if salutation == "Mrs." %}selected{% endif %}>Mrs.</option>
                            <option value="Ms." {% if salutation == "Ms." %}selected{% endif %}>Ms.</option>
                            <option value="Dr." {% if salutation == "Dr." %}selected{% endif %}>Dr.</option>
                        </select>
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">Nama Depan</label>
                        <input type="text" name="first_mid_name" value="{{ first_mid_name }}" placeholder="Admin" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#1a2b49] font-inter text-gray-800">
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">Nama Belakang</label>
                        <input type="text" name="last_name" value="{{ last_name }}" placeholder="Aero" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#1a2b49] font-inter text-gray-800">
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">Kewarganegaraan</label>
                        <input type="text" name="kewarganegaraan" value="{{ kewarganegaraan }}" placeholder="Indonesia" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#1a2b49] font-inter text-gray-800">
                    </div>

                    <div class="hidden md:block"></div>

                    <div>
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">Country Code</label>
                        <input type="text" name="country_code" value="{{ country_code }}" placeholder="+62" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#1a2b49] font-inter text-gray-800">
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">Nomor Telepon</label>
                        <input type="text" name="mobile_number" value="{{ mobile_number }}" placeholder="81111111111" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#1a2b49] font-inter text-gray-800">
                    </div>

                    <div>
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">Tanggal Lahir</label>
                        <input type="date" name="tanggal_lahir" value="{{ tanggal_lahir }}" required
                            class="w-full md:w-auto px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#1a2b49] font-inter text-gray-800">
                    </div>

                    <div class="hidden md:block"></div>

                    <div class="md:col-span-2 max-w-2xl">
                        <label class="block mb-2 text-sm font-semibold text-gray-700 font-inter">Kode Maskapai</label>
                        <select name="kode_maskapai"
                            class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-[#1a2b49] font-inter text-gray-800 cursor-pointer">
                            <option value="">Pilih Maskapai</option>
                            {% for kode, nama in maskapai_choices %}
                                <option value="{{ kode }}" {% if kode_maskapai == kode %}selected{% endif %}>
                                    {{ kode }} - {{ nama }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="flex justify-center mt-10">
                    <button type="submit"
                        class="w-full md:w-[586px] bg-[#1a2b49] text-white py-3.5 rounded-xl font-bold font-inter hover:bg-[#121e33] transition shadow-md">
                        Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.querySelector('form[action="/update-profile/"]');
        if (!form) return;
        const submitBtn = form.querySelector('button[type="submit"]');
        if (!submitBtn) return;
        
        const fields = [
            form.querySelector('select[name="salutation"]'),
            form.querySelector('input[name="first_mid_name"]'),
            form.querySelector('input[name="last_name"]'),
            form.querySelector('input[name="kewarganegaraan"]'),
            form.querySelector('input[name="country_code"]'),
            form.querySelector('input[name="mobile_number"]'),
            form.querySelector('input[name="tanggal_lahir"]')
        ];

        function checkFormValidity() {
            let allFilled = true;
            fields.forEach(field => {
                if (!field) return;
                const val = field.value.trim();
                if (val === "" || val.toLowerCase() === "none") {
                    allFilled = false;
                }
            });

            if (allFilled) {
                submitBtn.disabled = false;
                submitBtn.classList.remove('bg-gray-300', 'text-gray-500', 'cursor-not-allowed', 'opacity-60');
                submitBtn.classList.add('bg-[#1a2b49]', 'text-white', 'hover:bg-[#121e33]', 'cursor-pointer');
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.add('bg-gray-300', 'text-gray-500', 'cursor-not-allowed', 'opacity-60');
                submitBtn.classList.remove('bg-[#1a2b49]', 'text-white', 'hover:bg-[#121e33]', 'cursor-pointer');
            }
        }

        fields.forEach(field => {
            if (!field) return;
            field.addEventListener('input', checkFormValidity);
            field.addEventListener('change', checkFormValidity);
        });

        // Run immediately on page load
        checkFormValidity();
    });
</script>
{% endblock %}
